<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love Response</title>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 150px;
      color: #f32d2d;
    }
    h1 {
      font-size: 2.8em;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.4em;
      color: #b80000;
      margin-bottom: 30px;
    }
    .back {
      font-size: 1em;
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      background-color: #ff6f91;
      color: white;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .back:hover {
      background-color: #ff4e75;
    }
  </style>
</head>
<body>
  <h1>Ok... I will love you alone</h1>
  <p>Even if you don’t feel the same, my love will stay the same — forever!</p>
  <button class="back" onclick="goBack()">Back</button>

  <!-- Firebase SDK -->
  <script type="module">
    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDDKwORtOFhbwcBOYhNdcC3hdtqBj1Vk_I",
  authDomain: "ayush-4d7e2.firebaseapp.com",
  databaseURL: "https://ayush-4d7e2-default-rtdb.firebaseio.com",
  projectId: "ayush-4d7e2",
  storageBucket: "ayush-4d7e2.firebasestorage.app",
  messagingSenderId: "704386566850",
  appId: "1:704386566850:web:e683c41184769e2913095b",
  measurementId: "G-SEJTV16J8S"
};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Save response
    const responseRef = ref(database, 'responses');
    push(responseRef, {
      answer: "0%",
      timestamp: new Date().toISOString()
    });

    // Back button function
    window.goBack = function() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
