<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Do You Miss Me?</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SEJTV16J8S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SEJTV16J8S');
  </script>

  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 150px;
      color: #ff0000;
    }
    h2 {
      font-size: 2em;
      margin-bottom: 20px;
    }
    button {
      font-size: 1.5em;
      padding: 15px 40px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .yes {
      background-color: #ff6f91;
      color: white;
    }
    .yes:hover {
      background-color: #ff4e75;
    }
    .no {
      background-color: #ff6f91;
      color: white;
    }
    .no:hover {
      background-color: #ff4e75;
    }
  </style>
</head>
<body>
  <h2>If you love me even 1%, I will make that 100%</h2>
  <h2>If you love me 0%, I can’t make 100%</h2>

  <button class="yes" onclick="submitResponse('1%')">1%</button>
  <button class="no" onclick="submitResponse('0%')">0%</button>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDKwORtOFhbwcBOYhNdcC3hdtqBj1Vk_I",
      authDomain: "ayush-4d7e2.firebaseapp.com",
      databaseURL: "https://ayush-4d7e2-default-rtdb.firebaseio.com",
      projectId: "ayush-4d7e2",
      storageBucket: "ayush-4d7e2.firebasestorage.app",
      messagingSenderId: "704386566850",
      appId: "1:704386566850:web:e683c41184769e2913095b",
      measurementId: "G-SEJTV16J8S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.submitResponse = function(response) {
      const responsesRef = ref(db, 'responses');
      push(responsesRef, {
        answer: response,
        timestamp: new Date().toISOString()
      }).then(() => {
        if (response === '1%') {
          window.location.href = 'yes2.html';
        } else {
          window.location.href = 'no2.html';
        }
      });
    }
  </script>
</body>
</html>
