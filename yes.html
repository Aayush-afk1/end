<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Do You Love Me?</title>

  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 150px;
      color: #ff0000;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 40px;
    }
    button {
      font-size: 1.5em;
      padding: 15px 40px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .yes {
      background-color: #ff6f91;
      color: white;
    }
    .yes:hover {
      background-color: #ff4e75;
    }
    .no  {
      background-color: #ff6f91;
      color: white;
    }
    .no:hover {
      background-color: #ff4e75;
    }
  </style>
</head>
<body>
  <h1>Do You Love me?</h1>
  <button class="yes" onclick="saveResponse('Yes, I love you', 'yes3.html')">Yes, I love you</button>
  <button class="yes" onclick="saveResponse('I’m just confused', 'yes1.html')">I’m just confused</button>
  <button class="no" onclick="saveResponse('I don’t love you, that’s it', 'no1.html')">I don’t love you that’s it</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDDKwORtOFhbwcBOYhNdcC3hdtqBj1Vk_I",
      authDomain: "ayush-4d7e2.firebaseapp.com",
      databaseURL: "https://ayush-4d7e2-default-rtdb.firebaseio.com",
      projectId: "ayush-4d7e2",
      storageBucket: "ayush-4d7e2.firebasestorage.app",
      messagingSenderId: "704386566850",
      appId: "1:704386566850:web:e683c41184769e2913095b",
      measurementId: "G-SEJTV16J8S"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function saveResponse(answer, redirectUrl) {
      const timestamp = new Date().toISOString();
      db.ref("responses").push({
        answer: answer,
        time: timestamp
      }).then(() => {
        window.location.href = redirectUrl;
      }).catch((error) => {
        alert("Error saving response: " + error);
      });
    }
  </script>
