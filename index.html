<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Answer</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 150px;
      color: #ff0000;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 40px;
    }
    button {
      font-size: 1.5em;
      padding: 15px 40px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .yes {
      background-color: #ff6f91;
      color: white;
    }
    .yes:hover {
      background-color: #ff4e75;
    }
    .no {
      background-color: #ff6f91;
      color: white;
    }
    .no:hover {
      background-color: #ff4e75;
    }
  </style>
</head>
<body>
  <h1>Do You Miss Me?</h1>
  <button class="yes" onclick="saveResponse('Yes', 'yes.html')">Yes</button>
  <button class="no" onclick="saveResponse('No', 'no.html')">No</button>

  <script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDDKwORtOFhbwcBOYhNdcC3hdtqBj1Vk_I",
  authDomain: "ayush-4d7e2.firebaseapp.com",
  databaseURL: "https://ayush-4d7e2-default-rtdb.firebaseio.com",
  projectId: "ayush-4d7e2",
  storageBucket: "ayush-4d7e2.firebasestorage.app",
  messagingSenderId: "704386566850",
  appId: "1:704386566850:web:e683c41184769e2913095b",
  measurementId: "G-SEJTV16J8S"
};

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function saveResponse(answer, redirectUrl) {
      const timestamp = new Date().toISOString();
      db.ref("responses").push({
        response: answer,
        time: timestamp
      }).then(() => {
        window.location.href = redirectUrl;
      }).catch((err) => {
        alert("Failed to save response: " + err);
      });
    }
  </script>
</body>
</html>
