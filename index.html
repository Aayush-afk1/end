<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Miss Me? 💖</title>

  <!-- Google Analytics (replace ID below) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SEJTV16J8S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SEJTV16J8S');
  </script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 150px;
      color: #ff0000;
      margin: 0;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 40px;
    }

    button {
      font-size: 1.5em;
      padding: 15px 40px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .yes, .no {
      background-color: #ff6f91;
      color: white;
    }

    .yes:hover, .no:hover {
      background-color: #ff4e75;
    }
  </style>
</head>
<body>
  <h1>Do You Miss Me?</h1>
  <button class="yes" onclick="saveResponse('Yes', 'yes.html')">Yes</button>
  <button class="no" onclick="saveResponse('No', 'no.html')">No</button>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDDKwORtOFhbwcBOYhNdcC3hdtqBj1Vk_I",
      authDomain: "ayush-4d7e2.firebaseapp.com",
      databaseURL: "https://ayush-4d7e2-default-rtdb.firebaseio.com",
      projectId: "ayush-4d7e2",
      storageBucket: "ayush-4d7e2.appspot.com",
      messagingSenderId: "704386566850",
      appId: "1:704386566850:web:e683c41184769e2913095b",
      measurementId: "G-Y038Z1WP4M"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Save response to Firebase
    function saveResponse(answer, redirectUrl) {
      const timestamp = new Date().toISOString();
      db.ref("responses").push({
        response: answer,
        time: timestamp
      }).then(() => {
        window.location.href = redirectUrl;
      }).catch((err) => {
        alert("Failed to save response: " + err);
      });
    }
  </script>
</body>
</html>
